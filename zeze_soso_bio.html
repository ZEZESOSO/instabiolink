<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --ground:#FCEFEF;
    --surface:#FFFBFA;
    --surface-alt:#F8E2DE;
    --chrome-bg:#F6E2DF;
    --ink:#3D2228;
    --ink-soft:#8F6B6E;
    --accent:#E8905A;
    --accent-ink:#6B3240;
    --rose:#F0A3AE;
    --line:#F0D9D6;
    --shadow: rgba(107,43,58,0.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#231418;
      --surface:#2E1B1F;
      --surface-alt:#3D2429;
      --chrome-bg:#2A191D;
      --ink:#F7E6E9;
      --ink-soft:#C7A3A8;
      --accent:#F0A368;
      --accent-ink:#341017;
      --rose:#F2A8B4;
      --line:#45282D;
      --shadow: rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --ground:#1D1410;
    --surface:#2A1E19;
    --surface-alt:#3A2A22;
    --chrome-bg:#271C17;
    --ink:#F7ECE3;
    --ink-soft:#BCA296;
    --accent:#F0A94A;
    --accent-ink:#2A1A0C;
    --rose:#E8A9AE;
    --line:#3E2E27;
    --shadow: rgba(0,0,0,0.45);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--ground);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:'Gowun Dodum','Malgun Gothic',sans-serif;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:"";
    position:fixed;
    width:46vmax; height:46vmax;
    border-radius:50%;
    filter:blur(60px);
    opacity:.35;
    z-index:0;
    pointer-events:none;
  }
  body::before{ background:var(--accent); top:-18vmax; left:-16vmax; }
  body::after{ background:var(--rose); bottom:-20vmax; right:-16vmax; }

  .app-card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:412px;
    background:var(--surface);
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 24px 60px var(--shadow), 0 2px 8px var(--shadow);
    border:1px solid var(--line);
  }

  /* faux in-app browser chrome */
  .chrome-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    height:46px;
    padding:0 14px;
    background:var(--chrome-bg);
    border-bottom:1px solid var(--line);
    font-family:-apple-system,"Segoe UI",sans-serif;
  }
  .chrome-btn{
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .chrome-url{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    background:var(--surface);
    border-radius:9px;
    height:28px;
    color:var(--ink-soft);
    font-size:.72rem;
    letter-spacing:.01em;
    min-width:0;
    padding:0 10px;
  }
  .chrome-url span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .content{
    padding:40px 26px 34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .avatar-wrap{
    position:relative;
    animation:riseIn .5s ease both;
  }
  .avatar{
    position:relative;
    width:104px;height:104px;
    border-radius:50%;
    overflow:hidden;
    background:linear-gradient(135deg,var(--accent),var(--rose));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px var(--shadow);
  }
  .avatar span{
    font-family:'Gaegu',sans-serif;
    font-weight:700;
    font-size:2.6rem;
    color:var(--surface);
    line-height:1;
    transform:translateY(-2px);
  }
  .avatar-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .badge{
    position:absolute;
    right:-8px; bottom:-6px;
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-12deg);
    filter:drop-shadow(0 3px 5px var(--shadow));
  }
  .badge svg path{
    stroke:#FFFFFF;
    stroke-width:1.3;
    stroke-linejoin:round;
  }

  h1{
    margin:18px 0 0;
    font-family:'Gaegu',sans-serif;
    font-weight:700;
    font-size:1.65rem;
    color:var(--ink);
    animation:riseIn .5s ease .05s both;
  }
  .tagline{
    margin:6px 0 0;
    font-size:.95rem;
    color:var(--ink-soft);
    letter-spacing:.01em;
    animation:riseIn .5s ease .1s both;
  }

  .links{
    list-style:none;
    margin:30px 0 0;
    padding:0;
    width:100%;
    display:flex;
    flex-direction:column;
    gap:13px;
  }
  .links li{ animation:riseIn .5s ease both; }
  .links li:nth-child(1){ animation-delay:.15s; }
  .links li:nth-child(2){ animation-delay:.2s; }
  .links li:nth-child(3){ animation-delay:.25s; }

  .link-row{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:13px 15px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 1px 2px var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .link-row:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px var(--shadow);
  }
  .link-row:active{
    transform:translateY(0) scale(.98);
  }
  .link-row:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  .icon-chip{
    flex-shrink:0;
    width:44px;height:44px;
    border-radius:14px;
    background:var(--surface-alt);
    color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;
  }
  .row-text{
    flex:1;
    min-width:0;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .row-text .label{
    font-family:'Gaegu',sans-serif;
    font-weight:700;
    font-size:1.03rem;
    color:var(--ink);
  }
  .row-text .desc{
    font-size:.78rem;
    color:var(--ink-soft);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .chevron{
    flex-shrink:0;
    color:var(--ink-soft);
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
